name: Verify Ω-LOCKED Checksums

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checksum-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checksums
        run: |
          if [ ! -f "checksums.txt" ]; then
            echo "❌ checksums.txt missing"
            exit 1
          fi

          while read -r line; do
            if [[ "$line" =~ ^# ]] || [[ -z "$line" ]]; then
              continue
            fi

            FILE=$(echo "$line" | awk '{print $1}')
            EXPECTED=$(echo "$line" | awk '{print $2}')

            if [ ! -f "$FILE" ]; then
              echo "❌ File listed in checksums.txt not found: $FILE"
              exit 1
            fi

            ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "❌ Checksum mismatch for $FILE"
              echo "Expected: $EXPECTED"
              echo "Actual:   $ACTUAL"
              exit 1
            fi
          done < checksums.txt

          echo "✔ All Ω-LOCKED file checksums verified successfully."
